  argument_count: 1
  col: 6
  default_arguments:
  - null
  description: 'SCS is used to establish the character spacing for subsequent text.
    The established spacing remains in

    effect until the next occurrence of SCS, or of SELECT CHARACTER SPACING (SHS)
    or of SPACING

    INCREMENT (SPI) in the data stream, see annex C.

    Pn specifies the character spacing.

    The unit in which the parameter value is expressed is that established by the
    parameter value of SELECT

    SIZE UNIT (SSU).'
