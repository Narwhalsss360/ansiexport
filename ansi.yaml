    START OF A DIRECTED STRING, ESTABLISH THE DIRECTION LEFT-TO-RIGHT: 1
    START OF A DIRECTED STRING, ESTABLISH THE DIRECTION RIGHT-TO-LEFT: 2
  default_arguments:
  - 0
  description: SDS is used to establish in the data component the beginning and the
    end of a string of characters as well as the direction of the string. This direction
    may be different from that currently established. The indicated string follows
    the preceding text. The established character progression is not affected. The
    beginning of a directed string is indicated by SDS with a parameter value not
    equal to 0. A directed string may contain one or more nested strings. These nested
    strings may be directed strings the beginnings of which are indicated by SDS with
    a parameter value not equal to 0, or reversed strings the beginnings of which
    are indicated by START REVERSED STRING (SRS) with a parameter value of 1. Every
    beginning of such a string invokes the next deeper level of nesting. This Standard
    does not define the location of the active data position within any such nested
    string. The end of a directed string is indicated by SDS with a parameter value
    of 0. Every end of such a string re-establishes the next higher level of nesting
    (the one in effect prior to the string just ended). The direction is re-established
    to that in effect prior to the string just ended. The active data position is
