- abbreviation: SRS
  argument_count: 1
  col: 5
  constants:
    END REVERSED: 1
    START REVERSED: 0
  default_arguments:
  - 1
  description: 'SRS is used to establish in the data component the beginning and the
    end of a string of characters as well as the direction of the string. This direction
    is opposite to that currently established. The indicated string follows the preceding
    text. The established character progression is not affected. The beginning of
    a reversed string is indicated by SRS with a parameter value of 1. A reversed
    string may contain one or more nested strings. These nested strings may be reversed
    strings the beginnings of which are indicated by SRS with a parameter value of
    1, or directed strings the beginnings of which are indicated by START DIRECTED
    STRING (SDS) with a parameter value not equal to 0. Every beginning of such a
    string invokes the next deeper level of nesting. This Standard does not define
    the location of the active data position within any such nested string. The end
    of a reversed string is indicated by SRS with a parameter value of 0. Every end
    of such a string re-establishes the next higher level of nesting (the one in effect
    prior to the string just ended). The direction is re-established to that in effect
    prior to the string just ended. The active data position is moved to the character
    position following the characters of the string just ended. The parameter values
    are: 0 end of a reversed string; re-establish the previous direction 1 beginning
    of a reversed string; reverse the direction. NOTE 1 The effect of receiving a
    CVT, HT, SCP, SPD or VT control function within an SRS string is not defined by
    this Standard. NOTE 2 The control functions for area definition (DAQ, EPA, ESA,
    SPA, SSA) should not be used within an SRS string.'
  has_intermediate_byte: false
  name: START REVERSED STRING
  row: 11
  set: Fe
- abbreviation: PTX
  argument_count: 1
  col: 5
  constants:
    BEGINNING OF A STRING OF PRINCIPAL PARALLEL TEXT: 1
    BEGINNING OF A STRING OF SUPPLEMENTARY CHINESE PHONETIC ANNOTATION: 4
    BEGINNING OF A STRING OF SUPPLEMENTARY JAPANESE PHONETIC ANNOTATION: 3
    BEGINNING OF A STRING OF SUPPLEMENTARY PARALLEL TEXT: 2
    END OF A STRING OF SUPPLEMENTARY PHONETIC ANNOTATIONS: 5
    end of parallel texts: 0
  default_arguments:
  - 1
  description: PTX is used to delimit strings of graphic characters that are communicated
    one after another in the data stream but that are intended to be presented in
    parallel with one another, usually in adjacent lines. The parameter values are
    0 end of parallel texts 1 2 3 beginning of a string of principal parallel text
    beginning of a string of supplementary parallel text beginning of a string of
    supplementary Japanese phonetic annotation 4 beginning of a string of supplementary
    Chinese phonetic annotation 5 end of a string of supplementary phonetic annotations
    PTX with a parameter value of 1 indicates the beginning of the string of principal
    text intended to be presented in parallel with one or more strings of supplementary
    text. PTX with a parameter value of 2, 3 or 4 indicates the beginning of a string
    of supplementary text that is intended to be presented in parallel with either
    a string of principal text or the immediately preceding string of supplementary
    text, if any; at the same time it indicates the end of the preceding string of
    principal text or of the immediately preceding string of supplementary text, if
    any. The end of a string of supplementary text is indicated by a subsequent occurrence
    of PTX with a parameter value other than 1. PTX with a parameter value of 0 indicates
    the end of the strings of text intended to be presented in parallel with one another.
  has_intermediate_byte: false
  name: PARALLEL TEXTS
  row: 12
  set: Fe
