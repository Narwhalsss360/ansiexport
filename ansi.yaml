- abbreviation: GCC
  argument_count: 1
  col: 5
  default_arguments:
  - 0
  description: 'GCC is used to indicate that two or more graphic characters are to
    be imaged as one single graphic

    symbol. GCC with a parameter value of 0 indicates that the following two graphic
    characters are to be

    imaged as one single graphic symbol; GCC with a parameter value of 1 and GCC with
    a parameter value

    of 2 indicate respectively the beginning and the end of a string of graphic characters
    which are to be

    imaged as one single graphic symbol.'
  has_intermediate_byte: true
  name: GRAPHIC CHARACTER COMBINATION
  row: 15
  set: Fe
- abbreviation: TATE
  argument_count: 1
  col: 6
  default_arguments:
  - null
  description: 'TATE causes a character tabulation stop calling for trailing edge
    alignment to be set at character

    position n in the active line (the line that contains the active presentation
    position) and lines of

    subsequent text in the presentation component, where n equals the value of Pn.
    TATE causes the

    replacement of any tabulation stop previously set at that character position,
    but does not affect other

    tabulation stops. A text string aligned with a tabulation stop set by TATE will
    be positioned so that the (trailing edge of

    the) first graphic character of the string is placed at the tabulation stop.'
  has_intermediate_byte: true
  name: TABULATION ALIGNED TRAILING EDGE
  row: 0
  set: Fe
- abbreviation: TALE
  argument_count: 1
  col: 6
  default_arguments:
  - null
  description: 'TALE causes a character tabulation stop calling for leading edge alignment
    to be set at character

    position n in the active line (the line that contains the active presentation
    position) and lines of

    subsequent text in the presentation component, where n equals the value of Pn.
    TALE causes the

    replacement of any tabulation stop previously set at that character position,
    but does not affect other

    tabulation stops.

    A text string aligned with a tabulation stop set by TALE will be positioned so
    that the (leading edge of

    the) last graphic character of the string is placed at the tabulation stop.'
  has_intermediate_byte: true
  name: TABULATION ALIGNED LEADING EDGE
  row: 1
  set: Fe
- abbreviation: TAC
  argument_count: 1
  col: 6
  default_arguments:
  - null
  description: 'TAC causes a character tabulation stop calling for centring to be
    set at character position n in the active

    line (the line that contains the active presentation position) and lines of subsequent
    text in the

    presentation component, where n equals the value of Pn. TAC causes the replacement
    of any tabulation

    stop previously set at that character position, but does not affect other tabulation
    stops.

    A text string centred upon a tabulation stop set by TAC will be positioned so
    that the (trailing edge of

    the) first graphic character and the (leading edge of the) last graphic character
    are at approximately equal

    distances from the tabulation stop.'
  has_intermediate_byte: true
  name: TABULATION ALIGNED CENTRED
  row: 2
  set: Fe
- abbreviation: TCC
  argument_count: 2
  col: 6
  default_arguments:
  - null
  - 32
  description: 'TCC causes a character tabulation stop calling for alignment of a
    target graphic character to be set at

    character position n in the active line (the line that contains the active presentation
    position) and lines of

    subsequent text in the presentation component, where n equals the value of Pn1,
    and the target character

    about which centring is to be performed is specified by Pn2. TCC causes the replacement
    of any

    tabulation stop previously set at that character position, but does not affect
    other tabulation stops.

    The positioning of a text string aligned with a tabulation stop set by TCC will
    be determined by the first

    occurrence in the string of the target graphic character; that character will
    be centred upon the tabulation

    stop. If the target character does not occur within the string, then the trailing
    edge of the first character

    of the string will be positioned at the tabulation stop.

    The value of Pn2 indicates the code table position (binary value) of the target
    character in the currently

    invoked code. For a 7-bit code, the permissible range of values is 32 to 127;
    for an 8-bit code, the

    permissible range of values is 32 to 127 and 160 to 255.'
  has_intermediate_byte: true
  name: TABULATION CENTRED ON CHARACTER
  row: 3
  set: Fe
- abbreviation: TSR
  argument_count: 1
  col: 6
  default_arguments:
  - null
  description: 'TSR causes any character tabulation stop at character position n in
    the active line (the line that contains

    the active presentation position) and lines of subsequent text in the presentation
    component to be

    cleared, but does not affect other tabulation stops. n equals the value of Pn.'
