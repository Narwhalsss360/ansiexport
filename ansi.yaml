  description: 'STAB causes subsequent text in the presentation component to be aligned
    according to the position and

    the properties of a tabulation stop which is selected from a list according to
    the value of the parameter

    Ps.

    The use of this control function and means of specifying a list of tabulation
    stops to be referenced by the

    control function are specified in other standards, for example ISO 8613-6.'
