  description: 'SRCS is used to establish reduced inter-character escapement for subsequent
    text. The established

    reduced escapement remains in effect until the next occurrence of SRCS or of SET
    ADDITIONAL

    CHARACTER SEPARATION (SACS) in the data stream or until it is reset to the default
    value by a

    subsequent occurrence of CARRIAGE RETURN/LINE FEED (CR/LF) or of NEXT LINE (NEL)
    in the

    data stream, see annex C.

    Pn specifies the number of units by which the intercharacter escapement is reduced.

    The unit in which the parameter values are expressed is that established by the
    parameter value of

    SELECT SIZE UNIT (SSU).'
