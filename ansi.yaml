  description: 'SLS is used to establish the line spacing for subsequent text. The
    established spacing remains in effect

    until the next occurrence of SLS or of SELECT LINE SPACING (SVS) or of SPACING
    INCREMENT

    (SPI) in the data stream.

    Pn specifies the line spacing.

