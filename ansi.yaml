  set: Fe
- abbreviation: SPL
  argument_count: 1
  col: 6
  default_arguments:
  - null
  description: 'If the DEVICE COMPONENT SELECT MODE is set to PRESENTATION, SPL is
    used to establish at

    line position n in the active page (the page that contains the active presentation
    position) and pages of

    subsequent text in the presentation component the position beyond which the active
    presentation position

    can normally not be moved; where n equals the value of Pn. In the case of a device
    without data

    component, it is also the position beyond which no implicit movement of the active
    presentation position

    shall occur.

    If the DEVICE COMPONENT SELECT MODE is set to DATA, SPL is used to establish at
    line position

    n in the active page (the page that contains the active data position) and pages
